[package]
name = "make-it-drum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "make it drum — lecteur de kits VST3/CLAP (nih-plug)"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
make-it-drum-core = { workspace = true }
nih_plug = { workspace = true }
nih_plug_egui = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
zip = { workspace = true }
serde_json = { workspace = true }

[features]
# binaire autonome (JACK / CPAL / dummy) pour tester sans DAW et capturer l'interface
standalone = ["nih_plug/standalone"]

[[bin]]
name = "make-it-drum"
path = "src/main.rs"
required-features = ["standalone"]
