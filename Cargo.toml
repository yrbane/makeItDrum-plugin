[workspace]
resolver = "2"
members = ["crates/core", "crates/plugin", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/yrbane/makeItDrum-plugin"
authors = ["Masao « Saiya Geez »", "yrbane"]

[workspace.dependencies]
make-it-drum-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
# décodage des échantillons déposés depuis le navigateur d'une DAW (AIFF, MP3, FLAC, OGG)
symphonia = { version = "0.5.4", default-features = false, features = ["aiff", "mp3", "flac", "ogg", "vorbis", "pcm", "aac", "alac", "isomp4"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
base64 = "0.23"
dirs = "6.0"
# .adg de Live = XML gzippé
flate2 = "1.0"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

# egui-baseview épinglé par nih-plug ignore les événements de glisser-déposer de
# baseview : copie locale avec le relais vers egui (`vendor/egui-baseview`).
[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }

# baseview : types de pasteboard modernes (public.file-url), masque Copy+Generic,
# journal des dépôts (`vendor/baseview`).
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }
