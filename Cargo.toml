[workspace]
resolver = "2"
members = ["crates/core", "crates/plugin", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/yrbane/makeItDrum-plugin"
authors = ["Masao « Saiya Geez »", "yrbane"]

[workspace.dependencies]
make-it-drum-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
base64 = "0.23"
dirs = "6.0"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
