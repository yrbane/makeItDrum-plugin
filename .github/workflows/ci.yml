# Intégration continue : format, lints, tests, puis bundles VST3/CLAP par plateforme.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Dépendances système (baseview / egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bundle:
    name: bundle (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macos-universal, os: macos-latest,  target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.name == 'macos-universal' && ',x86_64-apple-darwin' || '' }}
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Bundle (macOS universel)
        if: matrix.name == 'macos-universal'
        run: cargo xtask bundle-universal make-it-drum --release
      - name: Bundle
        if: matrix.name != 'macos-universal'
        run: cargo xtask bundle make-it-drum --release --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          cd target/bundled
          ls -la
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../../make-it-drum-${{ matrix.name }}.zip" "make it drum.vst3" "make it drum.clap"
          else
            zip -r "../../make-it-drum-${{ matrix.name }}.zip" "make it drum.vst3" "make it drum.clap"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: make-it-drum-${{ matrix.name }}
          path: make-it-drum-${{ matrix.name }}.zip

  release:
    name: release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Notes depuis le CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## /{f=($2==v)} f&&!/^## /' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*.zip
